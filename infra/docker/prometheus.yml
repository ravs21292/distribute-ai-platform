global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9105"]
  - job_name: workers
    static_configs:
      - targets:
          - "cpu-worker-1:9100"
          - "cpu-worker-2:9100"
          - "cpu-worker-3:9100"
          - "embedding-worker:9100"
          - "cpu-ml-01:9100"
