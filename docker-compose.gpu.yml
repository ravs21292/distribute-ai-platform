# Optional overlay when an NVIDIA GPU is present.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# GPU workers run embedding / training / evaluation on CUDA.

services:
  gpu-ml-01:
    image: dml-platform:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command:
      [
        "python",
        "-m",
        "dml.worker.main",
        "--capabilities",
        "embedding,training,evaluation",
        "--device",
        "cuda",
        "--worker-id",
        "gpu-ml-01",
      ]
    environment:
      DML_DATABASE_URL: postgresql+asyncpg://dml:dml@postgres:5432/dml
      DML_DATABASE_URL_SYNC: postgresql+psycopg://dml:dml@postgres:5432/dml
      DML_REDIS_URL: redis://redis:6379/0
      DML_S3_ENDPOINT_URL: http://minio:9000
      DML_S3_ACCESS_KEY: dmlminio
      DML_S3_SECRET_KEY: dmlminio
      DML_OBJECT_STORE: s3
      DML_WORKER_ID: gpu-ml-01
      DML_WORKER_CAPABILITIES: embedding,training,evaluation
      DML_WORKER_DEVICE: cuda
    gpus: all
    depends_on:
      migrate:
        condition: service_completed_successfully
