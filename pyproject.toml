[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dml"
version = "0.1.0"
description = "Distributed AI execution platform — control plane, scheduler, and worker runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Distributed AI Platform" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.0",
    "psutil>=6.1.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.12",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
dml-api = "dml.api.main:run"
dml-scheduler = "dml.scheduler.main:run"
dml-worker = "dml.worker.main:run"

[tool.hatch.build.targets.wheel.force-include]
"src/dml/api/static/index.html" = "dml/api/static/index.html"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL and Redis",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
