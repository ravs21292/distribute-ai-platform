services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dml
      POSTGRES_PASSWORD: dml
      POSTGRES_DB: dml
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dml -d dml"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dmlminio
      MINIO_ROOT_PASSWORD: dmlminio
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  migrate:
    image: dml-platform:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DML_DATABASE_URL: postgresql+asyncpg://dml:dml@postgres:5432/dml
      DML_DATABASE_URL_SYNC: postgresql+psycopg://dml:dml@postgres:5432/dml
      DML_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: dml-platform:embed
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.embed
    command: ["python", "-m", "dml.api.main"]
    environment: &dml-env
      DML_DATABASE_URL: postgresql+asyncpg://dml:dml@postgres:5432/dml
      DML_DATABASE_URL_SYNC: postgresql+psycopg://dml:dml@postgres:5432/dml
      DML_REDIS_URL: redis://redis:6379/0
      DML_S3_ENDPOINT_URL: http://minio:9000
      DML_S3_ACCESS_KEY: dmlminio
      DML_S3_SECRET_KEY: dmlminio
      DML_OBJECT_STORE: s3
      DML_LOG_JSON: "true"
      DML_EMBEDDING_BACKEND: huggingface
      DML_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      DML_EMBEDDING_MODEL_VERSION: v1
      DML_EMBEDDING_DIM: "384"
      HF_HOME: /models/hf
      DML_PII_REDACTION_ENABLED: "true"
      # Set for production RBAC. Empty = open local demo (anonymous admin).
      # DML_AUTH_REQUIRED: "true"
      # DML_API_KEYS: '{"dml-admin-key":{"subject":"alice","role":"admin"},"dml-reader-key":{"subject":"bob","role":"reader"}}'
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/models/hf
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler:
    image: dml-platform:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["python", "-m", "dml.scheduler.main"]
    environment:
      <<: *dml-env
      DML_SCHEDULER_METRICS_PORT: "9105"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  cpu-worker-1:
    image: dml-platform:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command:
      [
        "python",
        "-m",
        "dml.worker.main",
        "--capabilities",
        "ingest,etl,dedupe,index,artifact",
        "--device",
        "cpu",
        "--worker-id",
        "cpu-worker-1",
      ]
    environment:
      <<: *dml-env
      DML_WORKER_ID: cpu-worker-1
      DML_WORKER_CAPABILITIES: ingest,etl,dedupe,index,artifact
      DML_WORKER_DEVICE: cpu
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  cpu-worker-2:
    image: dml-platform:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command:
      [
        "python",
        "-m",
        "dml.worker.main",
        "--capabilities",
        "ingest,etl,dedupe,index",
        "--device",
        "cpu",
        "--worker-id",
        "cpu-worker-2",
      ]
    environment:
      <<: *dml-env
      DML_WORKER_ID: cpu-worker-2
      DML_WORKER_CAPABILITIES: ingest,etl,dedupe,index
      DML_WORKER_DEVICE: cpu
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  cpu-worker-3:
    image: dml-platform:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command:
      [
        "python",
        "-m",
        "dml.worker.main",
        "--capabilities",
        "ingest,etl",
        "--device",
        "cpu",
        "--worker-id",
        "cpu-worker-3",
      ]
    environment:
      <<: *dml-env
      DML_WORKER_ID: cpu-worker-3
      DML_WORKER_CAPABILITIES: ingest,etl
      DML_WORKER_DEVICE: cpu
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  embedding-worker:
    image: dml-platform:embed
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.embed
    command:
      [
        "python",
        "-m",
        "dml.worker.main",
        "--capabilities",
        "embedding",
        "--device",
        "cpu",
        "--worker-id",
        "embedding-worker",
      ]
    environment:
      <<: *dml-env
      DML_WORKER_ID: embedding-worker
      DML_WORKER_CAPABILITIES: embedding
      DML_WORKER_DEVICE: cpu
    volumes:
      - hf_cache:/models/hf
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  embedding-worker-2:
    image: dml-platform:embed
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.embed
    command:
      [
        "python",
        "-m",
        "dml.worker.main",
        "--capabilities",
        "embedding",
        "--device",
        "cpu",
        "--worker-id",
        "embedding-worker-2",
      ]
    environment:
      <<: *dml-env
      DML_WORKER_ID: embedding-worker-2
      DML_WORKER_CAPABILITIES: embedding
      DML_WORKER_DEVICE: cpu
    volumes:
      - hf_cache:/models/hf
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  cpu-ml-01:
    image: dml-platform:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command:
      [
        "python",
        "-m",
        "dml.worker.main",
        "--capabilities",
        "training,evaluation",
        "--device",
        "cpu",
        "--worker-id",
        "cpu-ml-01",
      ]
    environment:
      <<: *dml-env
      DML_WORKER_ID: cpu-ml-01
      DML_WORKER_CAPABILITIES: training,evaluation
      DML_WORKER_DEVICE: cpu
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - scheduler

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  hf_cache:
