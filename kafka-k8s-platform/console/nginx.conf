# nginx serves the built React console; /v1 proxies to dap-api in-cluster.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /v1/ {
    proxy_pass http://dap-api:8080/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://dap-api:8080/health;
  }

  location / {
    try_files $uri /index.html;
  }
}
