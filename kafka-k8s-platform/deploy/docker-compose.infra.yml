# Infra only — use with kind/k3d app Deployments (host.docker.internal).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dap
      POSTGRES_PASSWORD: dap
      POSTGRES_DB: dap
    ports:
      - "5433:5432"
    volumes:
      - dap_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dap -d dap"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      # host.docker.internal so Kind pods (and host tools) can reconnect after metadata.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://host.docker.internal:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "19092:19092"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dapminio
      MINIO_ROOT_PASSWORD: dapminio
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - dap_minio:/data

  create-topics:
    image: apache/kafka:3.8.0
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $(seq 1 30); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list && break
          sleep 2
        done
        for t in dap.iot.telemetry dap.etl.events dap.embed.alerts dap.index.checks dap.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 6 --replication-factor 1
        done
        echo topics-ready

volumes:
  dap_pg:
  dap_minio:
