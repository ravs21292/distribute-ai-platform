apiVersion: apps/v1
kind: Deployment
metadata:
  name: dap-api
  namespace: dap
  labels:
    app: dap-api
    dap.stage: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dap-api
  template:
    metadata:
      labels:
        app: dap-api
        dap.stage: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: dap
      enableServiceLinks: false
      containers:
        - name: api
          image: dap/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: dap-config
            - secretRef:
                name: dap-secrets
                optional: true
          env:
            - name: DAP_SERVICE_NAME
              value: api
            - name: DAP_API_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dap-api
  namespace: dap
spec:
  selector:
    app: dap-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
