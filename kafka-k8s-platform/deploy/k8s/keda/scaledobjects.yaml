# KEDA demo: lower lag thresholds so scale-up is visible on a laptop.
# Poll often; cooldown shorter so scale-down is observable too.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dap-ingest-scaler
  namespace: dap
spec:
  scaleTargetRef:
    name: dap-ingest
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: host.docker.internal:19092
        consumerGroup: dap-ingest
        topic: dap.iot.telemetry
        lagThreshold: "5"
        activationLagThreshold: "1"
        offsetResetPolicy: earliest
---
