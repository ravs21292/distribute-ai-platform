# Local Kind demo: no auth forced (API keys empty).
# For prod, set keys and DAP_AUTH_REQUIRED=true in overlays/prod.
apiVersion: v1
kind: Secret
metadata:
  name: dap-secrets
  namespace: dap
type: Opaque
stringData:
  DAP_S3_ACCESS_KEY: "dapminio"
  DAP_S3_SECRET_KEY: "dapminio"
  DAP_API_KEYS: ""
  DAP_JWT_SECRET: ""
  DAP_KAFKA_SASL_USERNAME: ""
  DAP_KAFKA_SASL_PASSWORD: ""
