global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: dap-api
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics

  # Worker metrics ports when Compose publishes 9100+ (see docker-compose.yml)
  - job_name: dap-workers
    static_configs:
      - targets:
          - "host.docker.internal:9101"
          - "host.docker.internal:9102"
          - "host.docker.internal:9103"
          - "host.docker.internal:9104"
          - "host.docker.internal:9105"
