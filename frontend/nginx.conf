server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS — re-resolve so recreating `api` does not leave a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;

  location /v1/ops/ws {
    proxy_pass http://$api_upstream/v1/ops/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /v1/ {
    proxy_pass http://$api_upstream/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health/ {
    proxy_pass http://$api_upstream/health/;
  }

  location / {
    try_files $uri /index.html;
  }
}
